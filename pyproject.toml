[project]
name = "glowdesk-chatbot-backend"
version = "1.0.0"
description = "One conversation engine, two front doors: website widget and WhatsApp Cloud API."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "python-multipart==0.0.20",
    # Google Sheets mirror — optional; without credentials the adapter runs in mock mode
    "gspread==6.2.1",
    "google-auth==2.57.0",
    # Optional — only needed when LLM_PROVIDER is set to a real backend
    "anthropic==0.42.0",
    "openai==1.59.6",
]

[tool.vercel]
entrypoint = "app/main.py"
